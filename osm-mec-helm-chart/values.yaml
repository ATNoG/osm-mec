osm:
  # your osm host
  host: nbi.localhost.nip.io  # REPLACE

oss:
  enabled: true
  # host that will be shared by the cfs-portal to the client
  deployment:
    replicas: 1
    image: ghcr.io/atnog/osm-mec/oss:main
    imagePullPolicy: Always
    restartPolicy: Always
  service:
    type: LoadBalancer
    oss_port: 8080
    oss_targetPort: 8080
    ws_port: 8001
    ws_targetPort: 8001

kafka:
  enabled: true
  # kafka host (replace if using an external kafka or a different version of osm)
  host: kafka.osm.svc.cluster.local # REPLACE
  port: 9092

cfsPortal:
  enabled: true
  ossHost: localhost # REPLACE
  deployment:
    replicas: 1
    image: ghcr.io/atnog/osm-mec/cfs-portal:main
    imagePullPolicy: Always
    restartPolicy: Always
  service:
    type: NodePort
    port: 3000
    targetPort: 3000
    nodePort: 30000

meao:
  enabled: true
  deployment:
    replicas: 1
    image: ghcr.io/atnog/osm-mec/meao:main
    imagePullPolicy: Always
    restartPolicy: Always

mongo:
  enabled: true
  deployment:
    replicas: 1
    image: mongo:4.4
  service:
    port: 27017
    targetPort: 27017
  password: pass
  username: root

mongoExpress:
  enabled: true
  deployment:
    replicas: 1
    image: mongo-express:latest
  service:
    port: 8081
    targetPort: 8081
  password: pass
  username: root
